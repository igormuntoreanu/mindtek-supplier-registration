specVersion: "3.1"
metadata:
  name: mindtek.supplier.registration
type: application
framework:
  name: SAPUI5
  version: "1.136.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.ui.mdc
    - name: sap.fe.core
    - name: sap.fe.templates
    - name: sap.uxap
    - name: sap.ushell
    - name: sap.ui.fl
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-livereload
      afterMiddleware: compression
      configuration:
        extraExts: "xml,json,properties"
        watchPath: "webapp"
